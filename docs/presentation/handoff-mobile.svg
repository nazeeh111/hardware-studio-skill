<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 375 940" role="img" aria-labelledby="title desc"><title id="title">Valid structure is not verified clearance</title><desc id="desc">Two synthetic 10 by 8 by 4 millimetre spacers share one source. At second-instance x = 13 millimetres, reopened STEP solids have a nominal 3 millimetre gap. A separate control at x = 9 millimetres has 32 cubic millimetres of overlap and is labeled interference. Both are structurally valid. These top views use the same millimetre scale in both directions. The captured planning source and CAD hashes preserve one download; no physical fit or electrical safety is established.</desc><rect width="375" height="940" fill="#f6f4e9"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#173c37" text-anchor="start">HARDWARE STUDIO / SOURCE → NOMINAL CHECKS</text><text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#173c37" text-anchor="start">Valid structure is not</text><text x="24" y="107" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#173c37" text-anchor="start">verified clearance.</text><text x="24" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#173c37" text-anchor="start">One source. Two explicit placements. No hardware.</text><text x="24" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#173c37" text-anchor="start">01 / CAPTURED PROJECT</text><rect data-panel="0" data-instance="0" x="48" y="241" width="110" height="88" fill="#dfe6d2" stroke="#315a4f" stroke-width="1.5"/><text x="103" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c37" text-anchor="middle">A</text><rect data-panel="0" data-instance="1" x="191" y="241" width="110" height="88" fill="#c5d9d1" stroke="#315a4f" stroke-width="1.5"/><text x="246" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c37" text-anchor="middle">B</text><line x1="48" y1="333" x2="48" y2="339" stroke="#788a7e"/><text x="48" y="355" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">0</text><line x1="158" y1="333" x2="158" y2="339" stroke="#788a7e"/><text x="158" y="355" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">10</text><line x1="191" y1="333" x2="191" y2="339" stroke="#788a7e"/><text x="191" y="355" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">13</text><line x1="301" y1="333" x2="301" y2="339" stroke="#788a7e"/><text x="301" y="355" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">23</text><line x1="38" y1="241" x2="38" y2="329" stroke="#788a7e"/><text x="33" y="285" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#526b60" text-anchor="end">8</text><text x="48" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#173c37" text-anchor="start">x in mm · top view · height 4 mm</text><text x="48" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#315a4f" text-anchor="start">3 mm gap · native status PASSED</text><text x="24" y="452" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#173c37" text-anchor="start">02 / PLACEMENT CONTROL</text><rect data-panel="1" data-instance="0" x="48" y="500" width="110" height="88" fill="#dfe6d2" stroke="#315a4f" stroke-width="1.5"/><text x="103" y="544" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c37" text-anchor="middle">A</text><rect data-panel="1" data-instance="1" x="147" y="500" width="110" height="88" fill="#c5d9d1" stroke="#315a4f" stroke-width="1.5"/><text x="202" y="544" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c37" text-anchor="middle">B</text><rect data-overlap="true" x="147" y="500" width="11" height="88" fill="#ae5939" fill-opacity="0.8"/><line x1="48" y1="592" x2="48" y2="598" stroke="#788a7e"/><text x="48" y="614" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">0</text><line x1="158" y1="592" x2="158" y2="598" stroke="#788a7e"/><text x="158" y="614" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">10</text><line x1="147" y1="592" x2="147" y2="598" stroke="#788a7e"/><text x="147" y="614" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">9</text><line x1="257" y1="592" x2="257" y2="598" stroke="#788a7e"/><text x="257" y="614" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#526b60" text-anchor="middle">19</text><line x1="38" y1="500" x2="38" y2="588" stroke="#788a7e"/><text x="33" y="544" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#526b60" text-anchor="end">8</text><text x="48" y="641" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#173c37" text-anchor="start">x in mm · top view · height 4 mm</text><text x="48" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a3492d" text-anchor="start">32 mm³ overlap · INTERFERENCE</text><text x="24" y="802" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#173c37" text-anchor="start">STRUCTURE ≠ NOMINAL GEOMETRY ≠ PHYSICAL FIT</text><text x="24" y="831" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#173c37" text-anchor="start">The source checker passes both inputs.</text><text x="24" y="856" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#173c37" text-anchor="start">STEP readback reports the placement difference.</text><text x="24" y="889" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#173c37" text-anchor="start">Captured source + generated CAD + file hashes.</text><text x="24" y="920" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#173c37" text-anchor="start">Same-kernel software checks. Fabrication and electrical review remain open.</text></svg>